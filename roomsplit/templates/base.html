<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RoomSplit{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ url_for('index') }}">
          <span class="brand-mark" aria-hidden="true">R<span>.</span></span>
          <strong>RoomSplit</strong>
        </a>
        <nav class="account-nav" aria-label="Account">
          {% if g.current_user %}
            <a href="{{ url_for('rooms.index') }}">My events</a>
            <span class="account-name">Signed in as <strong>{{ g.current_user.username }}</strong></span>
            <form action="{{ url_for('auth.sign_out') }}" method="post">
              <button class="button button-small button-secondary" type="submit">Sign out</button>
            </form>
          {% else %}
            <a href="{{ url_for('auth.sign_in') }}">Sign in</a>
            <a class="button button-small button-primary" href="{{ url_for('auth.register') }}">Get started</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main id="main-content" class="site-main" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <span>RoomSplit <span aria-hidden="true">·</span> A little more clarity, together.</span>
      <span>Track shared expenses. No money moves here.</span>
    </footer>
  </body>
</html>
