{% extends "base.html" %}
{% block title %}RoomSplit{% endblock %}
{% block content %}
  <section>
    <h1>RoomSplit</h1>
    <p>A clear place to understand shared expenses.</p>
    {% if g.current_user %}
      <p><a href="{{ url_for('rooms.index') }}">Go to your rooms</a></p>
    {% else %}
      <p><a href="{{ url_for('auth.register') }}">Create an account</a></p>
      <p><a href="{{ url_for('auth.sign_in') }}">Sign in</a></p>
    {% endif %}
  </section>
{% endblock %}
